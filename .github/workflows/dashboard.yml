name: Build training dashboard

on:
  schedule:
    # Every 30 minutes. Cron is UTC. Adjust as you like.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time; let the newest run win.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r backend/requirements.txt

      - name: Build dashboard.json
        working-directory: backend
        env:
          # Garmin -> ACTUAL mileage (one token blob per person, preferred).
          GARMIN_TOKENS_BASE64_RUBY: ${{ secrets.GARMIN_TOKENS_BASE64_RUBY }}
          GARMIN_TOKENS_BASE64_JIAREN: ${{ secrets.GARMIN_TOKENS_BASE64_JIAREN }}
          # Optional email/password fallback per person.
          GARMIN_EMAIL_RUBY: ${{ secrets.GARMIN_EMAIL_RUBY }}
          GARMIN_PASSWORD_RUBY: ${{ secrets.GARMIN_PASSWORD_RUBY }}
          GARMIN_EMAIL_JIAREN: ${{ secrets.GARMIN_EMAIL_JIAREN }}
          GARMIN_PASSWORD_JIAREN: ${{ secrets.GARMIN_PASSWORD_JIAREN }}
          # Final Surge -> PLANNED weekly mileage (optional; 26.2 mi fallback).
          FINALSURGE_EMAIL_RUBY: ${{ secrets.FINALSURGE_EMAIL_RUBY }}
          FINALSURGE_PASSWORD_RUBY: ${{ secrets.FINALSURGE_PASSWORD_RUBY }}
          FINALSURGE_EMAIL_JIAREN: ${{ secrets.FINALSURGE_EMAIL_JIAREN }}
          FINALSURGE_PASSWORD_JIAREN: ${{ secrets.FINALSURGE_PASSWORD_JIAREN }}
        run: python build_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: backend/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
